<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer reticle crosshairs (lime) -->
  <line x1="50" y1="6" x2="50" y2="18" stroke="#d8ff43" stroke-width="2.6" stroke-linecap="square"/>
  <line x1="50" y1="82" x2="50" y2="94" stroke="#d8ff43" stroke-width="2.6" stroke-linecap="square"/>
  <line x1="6" y1="50" x2="18" y2="50" stroke="#d8ff43" stroke-width="2.6" stroke-linecap="square"/>
  <line x1="82" y1="50" x2="94" y2="50" stroke="#d8ff43" stroke-width="2.6" stroke-linecap="square"/>
  
  <!-- Outer circle (lime) -->
  <circle cx="50" cy="50" r="32" stroke="#d8ff43" stroke-width="2.6"/>
  
  <!-- Diamond (cyan) -->
  <polygon points="50,18 69,50 50,82 31,50" stroke="#30E6FF" stroke-width="2.6" fill="none"/>
  
  <!-- Eye almond shape (hot pink) -->
  <path d="M 19 50 C 28 32, 72 32, 81 50 C 72 68, 28 68, 19 50 Z" stroke="#ff67bd" stroke-width="2.6" fill="none"/>
  
  <!-- Center pupil (ivory/paper) -->
  <circle cx="50" cy="50" r="4.6" fill="#F3F0E8"/>
</svg>
